# agent-todo 容器编排
#
# 一键启动：docker compose up -d --build
#   - app：我们的应用镜像（server 托管 web 静态产物），对外 3001
#   - db ：Postgres，数据在命名卷 pgdata；本机可用 psql 连 5432（不需要可删掉端口映射）
# 数据卷：
#   - pgdata：Postgres 数据（Docker 命名卷）
#   - ./data/uploads：上传文件（bind mount 到宿主机，未来图片上传用）

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent_todo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent_todo_dev}
      POSTGRES_DB: ${POSTGRES_DB:-agent_todo}
    volumes:
      # Postgres 18 起官方镜像要求挂载 /var/lib/postgresql（数据在 18/docker 子目录下），
      # 挂在旧的 /var/lib/postgresql/data 会拒绝启动
      - pgdata:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent_todo} -d ${POSTGRES_DB:-agent_todo}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  app:
    build: .
    image: agent-todo:latest
    init: true
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      STATIC_DIR: /app/packages/web/dist
      UPLOADS_DIR: /data/uploads
      DATABASE_URL: postgres://${POSTGRES_USER:-agent_todo}:${POSTGRES_PASSWORD:-agent_todo_dev}@db:5432/${POSTGRES_DB:-agent_todo}
    volumes:
      - ./data/uploads:/data/uploads
    ports:
      - "${APP_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
