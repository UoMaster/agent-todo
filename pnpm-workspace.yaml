packages:
  - packages/*

# 依赖版本在这里统一维护，各包用 "catalog:" 引用
# 文档：https://pnpm.io/catalogs
catalog:
  '@electric-sql/pglite': ^0.5.9
  '@hono/node-server': ^2.1.5
  '@hono/zod-validator': ^0.9.1
  '@types/node': ^24.13.3
  '@types/pg': ^8.23.1
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@unocss/preset-wind4': ^66.11.0
  '@unocss/vite': ^66.11.0
  '@vitejs/plugin-react': ^6.1.2
  '@vitest/browser-playwright': ^5.0.4
  '@vitest/coverage-istanbul': ^5.0.4
  ansis: ^4.4.0
  citty: ^0.2.2
  dompurify: ^3.4.17
  hono: ^4.13.13
  marked: ^18.1.1
  oxlint: ^1.88.0
  pg: ^8.23.1
  playwright: ^1.64.0
  react: ^19.3.0
  react-dom: ^19.3.0
  typescript: ~6.0.2
  vite: ^8.3.4
  vitest: ^5.0.4
  vitest-browser-react: ^2.3.0
  zod: ^4.6.7

